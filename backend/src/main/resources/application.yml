server:
  port: 5566

spring:
  application:
    name: test-engine
  datasource:
    url: jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  file:
    name: logs/test-engine.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7

app:
  jwt:
    # local dev secret, override via APP_JWT_SECRET in production
    secret: ${APP_JWT_SECRET:TEST-ENGINE-LOCAL-DEV-SECRET-KEY-CHANGE-ME-IN-PROD-0123456789}
    expiration-ms: 86400000
