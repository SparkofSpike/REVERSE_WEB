# Test-only overrides. This file shadows src/main/resources/application.yml for
# the properties below, so `mvn test` never touches the developer's real
# database at backend/data/testdb.mv.db.
#
# The database stays a *file* database on purpose: the Spring context is shared
# between test classes, and a file keeps the tables available across contexts.
# It lives under target/ so `mvn clean` wipes it.
spring.datasource.url=jdbc:h2:file:./target/testdb;AUTO_SERVER=FALSE

# The console has no purpose under test and is off by default in production too.
spring.h2.console.enabled=false
